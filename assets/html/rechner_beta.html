<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
        }

        #task-container {
            width: 300px;
            padding: 15px;
            background: #f8f9fa;
            border-right: 2px solid #ddd;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        #ggb-element {
            flex-grow: 1;
            height: 100%;
        }

        .task {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .completed {
            background: lightgreen;
        }
    </style>
</head>

<body>
    <div id="task-container">
        <h2>Aufgaben</h2>
        <ul id="task-list"></ul>
    </div>
    <div id="ggb-element"></div>

    <script>
        var ggbApp = new GGBApplet({
            "appName": "graphing",
            "width": window.innerWidth - 300,
            "height": window.innerHeight,
            "showToolBar": true,
            "showAlgebraInput": true,
            "showMenuBar": false
        }, true);

        ggbApp.inject('ggb-element');

        let lessonTasks = [];

        function addTask(id, description) {
            const taskList = document.getElementById("task-list");
            const taskItem = document.createElement("li");
            taskItem.classList.add("task");
            taskItem.id = id;
            taskItem.textContent = description;
            taskList.appendChild(taskItem);
        }

        function markTaskCompleted(id) {
            const taskItem = document.getElementById(id);
            if (taskItem) {
                taskItem.classList.add("completed");
            }
        }

        function checkTasks() {
            if (!ggbApp.getAppletObject()) return;
            const ggb = ggbApp.getAppletObject();

            lessonTasks.forEach(task => {
                try {
                    if (task.conditionFunction(ggb)) {
                        markTaskCompleted(task.id);
                    }
                } catch (error) {
                    console.error(`Error checking task ${task.id}:`, error);
                }
            });
        }

        window.addEventListener("message", (event) => {
            if (event.data.type === "loadTasks") {
                document.getElementById("task-list").innerHTML = ""; // Clear previous tasks
                lessonTasks = event.data.tasks.map(task => ({
                    id: task.id,
                    description: task.description,
                    conditionFunction: new Function("ggb", task.condition) // Convert JSON string to JavaScript function
                }));
                lessonTasks.forEach(task => addTask(task.id, task.description));
            }
        });

        setInterval(checkTasks, 1000);
    </script>
</body>

</html>
