<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #ggb-element {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="ggb-element"></div>

    <script>
        var ggbAPI;
        var currentTasks = [];

        function receiveTasksFromFlutter(tasksJson) {
            try {
                currentTasks = JSON.parse(tasksJson);
                console.log("📥 Aufgaben von Flutter empfangen:", currentTasks);
            } catch (error) {
                console.error("❌ Fehler beim Parsen der Aufgaben:", error);
            }
        }

        function getTaskStatus() {
            let taskStatus = {};

            if (!ggbAPI || currentTasks.length === 0) {
                console.warn("⚠️ Keine Aufgaben oder GeoGebra-API nicht verfügbar!");
                return taskStatus;
            }

            let objects = ggbAPI.getAllObjectNames();
            console.log("📝 Gefundene GeoGebra-Objekte:", objects);

            currentTasks.forEach(task => {
                let correct = false;

                switch (task.condition.type) {
                    case "point":
                        objects.forEach(obj => {
                            if (ggbAPI.getObjectType(obj) === "point") {
                                let x = ggbAPI.getXcoord(obj);
                                let y = ggbAPI.getYcoord(obj);
                                task.condition.solutions.forEach(solution => {
                                    if (Math.abs(x - solution.x) < 0.01 && Math.abs(y - solution.y) < 0.01) {
                                        correct = true;
                                    }
                                });
                            }
                        });
                        break;
                }

                console.log(`✅ Aufgabe ${task.taskId}: ${correct ? "Bestanden" : "Nicht bestanden"}`);
                taskStatus[task.taskId] = correct;
            });

            return taskStatus;
        }

        function sendTaskStatusToFlutter() {
            let status = getTaskStatus();
            console.log("📤 Sende an Flutter:", status);
            if (window.taskCompleted) {
                window.taskCompleted.postMessage(JSON.stringify(status));
            }
        }


        var ggbApp = new GGBApplet({
            "appName": "graphing",
            "width": window.innerWidth,
            "height": window.innerHeight,
            "showToolBar": true,
            "showAlgebraInput": true,
            "showMenuBar": false,
            "appletOnLoad": function (api) {
                ggbAPI = api;
                console.log("🎯 GeoGebra API geladen!");
                setInterval(sendTaskStatusToFlutter, 1000);
            }
        }, true);

        ggbApp.inject('ggb-element');
    </script>
</body>

</html>
