<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #ggb-element {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="ggb-element"></div>

    <script>
        var ggbApp = new GGBApplet({
            "appName": "graphing",
            "width": window.innerWidth,
            "height": window.innerHeight,
            "showToolBar": true,
            "showAlgebraInput": true,
            "showMenuBar": false
        }, true);

        ggbApp.inject('ggb-element');

        function checkTask() {
            let point = ggbApplet.getValueString("A"); // Get point A
            return point;
        }

        function receiveFromFlutter(data) {
            if (data === "RESET") {
                ggbApplet.reset(); 
            } else {
                ggbApplet.setXML(data); 
            }
        }

        function saveGeoGebraState() {
            let state = ggbApplet.getXML();
            window.FlutterChannel.postMessage(state);
        }
    </script>
</body>
</html>
