<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #ggb-element {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="ggb-element"></div>

  <script>
    var ggbAPI;
    var currentTasks = [];
    let savedStatus = {};
    let manualCompletions = {};

    function receiveTasksFromFlutter(tasksJson) {
      try {
        currentTasks = JSON.parse(tasksJson);
        // console.log("📥 Aufgaben von Flutter empfangen:", currentTasks);
      } catch (error) {
        console.error("❌ Fehler beim Parsen der Aufgaben:", error);
      }
    }

    function getTaskStatus() {
      let taskStatus = {};

      if (!ggbAPI || currentTasks.length === 0) {
        console.warn("geogebra api or tasks not available");
        return taskStatus;
      }

      let objects = ggbAPI.getAllObjectNames();
      console.log("found geogebra objects:", objects);

      currentTasks.forEach(task => {
        let correct = false;

        switch (task.condition.type) {
          case "point":
            objects.forEach(obj => {
              if (ggbAPI.getObjectType(obj) === "point") {
                let x = ggbAPI.getXcoord(obj);
                let y = ggbAPI.getYcoord(obj);
                task.condition.solutions.forEach(solution => {
                  if (Math.abs(x - solution.x) < 0.01 && Math.abs(y - solution.y) < 0.01) {
                    correct = true;
                  }
                });
              }
            });
            break;

          case "equation":
            task.condition.solutions.forEach(solution => {
              if (objects.includes(solution.name)) {
                let def = ggbAPI.getValueString(solution.name);
                if (def === solution.definition) {
                  correct = true;
                }
              }
            });
            break;

          case "function_value":
// Überprüft, ob der Funktionswert an der Stelle x dem erwarteten Wert entspricht.
            task.condition.solutions.forEach(solution => // Hier erwarten wir, dass jedes Lösungselement ein zusätzliches Feld "expected" enthält.
{
              try {
// Hier erwarten wir, dass jedes Lösungselement ein zusätzliches Feld "expected" enthält.
                let computed = ggbAPI.getValue(solution.function + "(" + solution.x + ")");
                if (Math.abs(computed - solution.expected) < 0.01) {
                  correct = true;
                }
              } catch (e) {
                console.error(e);
              }
            });
            break;

          case "solve_equation":
// Annahme: Der Nutzer hat eine Lösung des angegebenen Gleichungsausdrucks erzeugt.
            task.condition.solutions.forEach(solution => {
              if (objects.includes(solution.equation)) {
                correct = true;
              }
            });
            break;

          case "graphical_solution":
// Beispielhaft: Überprüfe, ob das grafische Element (z. B. Schnittpunkt) vorhanden ist.
            task.condition.solutions.forEach(solution => {
              if (objects.includes(solution.equation)) {
                correct = true;
              }
            });
            break;

          case "line":
// Überprüft, ob eine Linie mit dem angegebenen Namen existiert.
            task.condition.solutions.forEach(solution => {
              if (objects.includes(solution.name) && ggbAPI.getObjectType(solution.name) === "line") {
                correct = true;
              }
            });
            break;

          case "distance":
            task.condition.solutions.forEach(solution => {
              try {
                let dist = ggbAPI.getDistance(solution.points[0], solution.points[1]);
                if (Math.abs(dist - solution.expected) < 0.01) {
                  correct = true;
                }
              } catch (e) {
                console.error(e);
              }
            });
            break;

          case "rename":
// Überprüft, ob das alte Objekt nicht mehr existiert und das neue Objekt vorhanden ist.
            task.condition.solutions.forEach(solution => {
              if (!objects.includes(solution.oldName) && objects.includes(solution.newName)) {
                correct = true;
              }
            });
            break;

          case "scale":
// Beispielhaft: Überprüft, ob das Verhältnis der x- zur y-Achse dem erwarteten Wert entspricht.
            task.condition.solutions.forEach(solution => {
// Hier wird angenommen, dass die API eine Methode getCoordSystem liefert
              // mit Eigenschaften xscale und yscale.
              let cs = ggbAPI.getCoordSystem ? ggbAPI.getCoordSystem() : { xscale: 1, yscale: 1 };
              let ratio = cs.xscale / cs.yscale;
              if (Math.abs(ratio - solution.expectedRatio) < 0.01) {
                correct = true;
              }
            });
            break;

          case "note":
// Z.B. wird ein manueller Bestätigungswert erwartet (über das Objekt manualCompletions).
            task.condition.solutions.forEach(solution => {
              if (manualCompletions[task.taskId]) {
                correct = true;
              }
            });
            break;

          case "zero_point":
// Überprüft, ob die Nullstelle der Funktion gefunden wurde.
            task.condition.solutions.forEach(solution => {
              try {
                let zero = ggbAPI.getValue("Löse(" + solution.function + " = 0)");
                if (!isNaN(zero)) {
                  correct = true;
                }
              } catch (e) {
                console.error(e);
              }
            });
            break;

          case "y_intercept":
// Überprüft, ob der y-Achsenabschnitt korrekt ermittelt wurde.
            task.condition.solutions.forEach(solution => {
              try {
// Pseudo-Code: Annahme, dass es eine Methode zur Ermittlung des y-Achsenabschnitts gibt.
                let yIntercept = ggbAPI.getYcoord ? ggbAPI.getYcoord(solution.function, 0) : null;
                if (yIntercept !== null && Math.abs(yIntercept - solution.expected) < 0.01) {
                  correct = true;
                }
              } catch (e) {
                console.error(e);
              }
            });
            break;

          case "intersection":
// Überprüft, ob der Schnittpunkt der angegebenen Funktionen existiert.
            task.condition.solutions.forEach(solution => {
              try {
// Pseudo-Code: Man könnte den Schnittpunkt über eine spezielle Namenskonvention oder Berechnung ermitteln.
                let ix = ggbAPI.getXcoord(solution.functions.join("_"));
                let iy = ggbAPI.getYcoord(solution.functions.join("_"));
                if (!isNaN(ix) && !isNaN(iy)) {
                  correct = true;
                }
              } catch (e) {
                console.error(e);
              }
            });
            break;

          default:
            console.warn("Unbekannter Typ:", task.condition.type);
        }

        taskStatus[task.taskId] = correct;
      });

      return taskStatus;
    }

    function sendTaskStatusToFlutter() {
      let status = getTaskStatus();
      if (window.taskCompleted) {
        window.taskCompleted.postMessage(JSON.stringify(status));
      }
    }


    var ggbApp = new GGBApplet({
      "appName": "graphing",
      "width": window.innerWidth,
      "height": window.innerHeight,
      "showToolBar": true,
      "showAlgebraInput": true,
      "showMenuBar": false,
      "appletOnLoad": function (api) {
        ggbAPI = api;
        // console.log("🎯 GeoGebra API geladen!");
        setInterval(sendTaskStatusToFlutter, 1000);
      }
    }, true);

    ggbApp.inject('ggb-element');
  </script>
</body>

</html>
